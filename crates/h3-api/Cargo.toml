[package]
name = "h3-api"
description = "Local /api/v1 server for agents and the MCP server."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["json", "query", "macros"] }
h3-comfy.workspace = true
h3-core.workspace = true
h3-graph.workspace = true
h3-image.workspace = true
h3-jobs.workspace = true
h3-media.workspace = true
h3-pipeline.workspace = true
h3-project.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
axum = "0.8"
h3-project.workspace = true
image.workspace = true
base64.workspace = true
